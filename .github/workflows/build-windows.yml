
name: Build AutoWallpaper for Windows 7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows 7 x64
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Install compatible dependencies
        run: |
          python -m pip install "pip<25.1"
          python -m pip install "Pillow==9.5.0"
          python -m pip install "customtkinter==5.2.2"
          python -m pip install "pyinstaller==5.13.2"

      - name: Check source
        shell: pwsh
        run: |
          if (!(Test-Path "app.py")) {
            throw "app.py not found in repository root"
          }

      - name: Build application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name AutoWallpaper
          --collect-all customtkinter
          app.py

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/AutoWallpaper/AutoWallpaper.exe")) {
            throw "AutoWallpaper.exe was not created"
          }

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/AutoWallpaper/*" `
            -DestinationPath "AutoWallpaper-Windows7-x64.zip"

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AutoWallpaper-Windows7-x64
          path: AutoWallpaper-Windows7-x64.zip
          if-no-files-found: error
          retention-days: 30
